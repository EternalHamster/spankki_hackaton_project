[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "money-coach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.17,<2",
  "duckdb>=1.4,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2.16,<3"]
cloud = ["anthropic[vertex,google_cloud]>=1.17,<2"]

[project.scripts]
money-coach-import = "money_coach.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
