services:
  ui:
    image: oma-talous-ui:local
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
